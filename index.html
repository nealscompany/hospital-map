<style>
  :root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--done:#9ca3af;--panel:#f9fafb;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--fg);background:var(--bg);font-size:14px}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;background:var(--bg);z-index:1001}
  header select,header input{font-size:14px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);min-width:0}
  header select{flex:1 1 90px}
  header input{flex:2 1 120px}
  .btn{font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:active{opacity:.7}
  #main{flex:1;display:flex;min-height:0;position:relative}
  #mapwrap{flex:1;min-height:0;position:relative;display:flex}
  #map{flex:1;min-height:0}
  #panel{width:360px;max-width:100%;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
  #panel .head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  #panel .head b{font-size:15px}
  #panel .sub{color:var(--muted);font-size:12px}
  #list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .row{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .row:hover{background:var(--panel)}
  .row.done .nm{color:var(--done);text-decoration:line-through}
  .row .idx{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
  .row.done .idx{background:var(--done)}
  .row .body{flex:1;min-width:0}
  .row .nm{font-weight:600}
  .row .ad{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dist{color:var(--accent);font-size:12px;white-space:nowrap}
  .row input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none}
  .area{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .area:hover{background:var(--panel)}
  .area .bar{height:6px;background:#dbeafe;border-radius:3px;margin-top:5px;overflow:hidden}
  .area .bar i{display:block;height:100%;background:var(--accent)}
  .area .cnt{font-weight:700;font-size:16px;white-space:nowrap;margin-left:10px}
  .area .cnt small{font-weight:400;color:var(--muted);font-size:11px}
  .area .lbl{flex:1;min-width:0}
  .area .lbl .sido{color:var(--muted);font-size:11px}
  .leaflet-popup-content{margin:12px 14px;min-width:220px;font-size:13px;line-height:1.45}
  .pp b{font-size:15px}
  .pp .ad{color:var(--muted);margin:2px 0 4px}
  .pp .nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}
  .pp .nav a{display:block;text-align:center;padding:7px 4px;border-radius:7px;color:#fff;text-decoration:none;font-weight:600;font-size:12px}
  .pp .nav a.kakao{background:#fae100;color:#111}
  .pp .nav a.naver{background:#03c75a}
  .pp .nav a.tmap{background:#e52d27}
  .pp .nav a.kmap{background:#111}
  .pp .nav a.tel{background:#2563eb}
  .pp .nav a.copy{background:#6b7280}
  .pp label{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}
  .pp label input{width:18px;height:18px}
  .pp textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:5px;font-size:12px;resize:vertical;min-height:34px;font-family:inherit}
  #me-btn{position:absolute;right:10px;bottom:24px;z-index:1000;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:20px;cursor:pointer}
  #toggle-panel{display:none}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px #2563eb,0 0 12px rgba(37,99,235,.6)}
  .pin{width:0;height:0}
  .pin i{position:absolute;left:-9px;top:-24px;width:18px;height:24px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 24'><path d='M9 0C4 0 0 4 0 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z' fill='%232563eb' stroke='%23fff' stroke-width='1.2'/><circle cx='9' cy='9' r='3.5' fill='%23fff'/></svg>") no-repeat}
  .pin.done i{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 24'><path d='M9 0C4 0 0 4 0 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z' fill='%239ca3af' stroke='%23fff' stroke-width='1.2'/><circle cx='9' cy='9' r='3.5' fill='%23fff'/></svg>")}
  .pin.hosp i{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 24'><path d='M9 0C4 0 0 4 0 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z' fill='%23dc2626' stroke='%23fff' stroke-width='1.2'/><circle cx='9' cy='9' r='3.5' fill='%23fff'/></svg>")}
  .pin.hosp.done i{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 24'><path d='M9 0C4 0 0 4 0 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z' fill='%239ca3af' stroke='%23fff' stroke-width='1.2'/><circle cx='9' cy='9' r='3.5' fill='%23fff'/></svg>")}
  .legend{position:absolute;left:10px;bottom:24px;max-width:calc(100% - 80px);z-index:1000;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.6}
  .legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
  @media (max-width:760px){
    #main{flex-direction:column}
    #panel{width:100%;border-left:0;border-top:1px solid var(--line);height:42%;flex:none}
    #panel.collapsed{height:44px}
    #panel.collapsed #list{display:none}
    #toggle-panel{display:inline-block}
    #mapwrap{flex:1}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <select id="sido"><option value="">시도 전체</option></select>
    <select id="gu"><option value="">구역(시군구) 전체</option></select>
    <select id="dong"><option value="">동 전체</option></select>
    <input id="q" type="search" placeholder="병원명 / 주소 검색">
    <button class="btn" id="hideDone" title="방문 완료 숨기기">완료 숨김: OFF</button>
    <button class="btn" id="reset">초기화</button>
  </header>
  <div id="main">
    <div id="mapwrap">
    <div id="map"></div>
    <button id="me-btn" title="내 위치">◎</button>
    <div class="legend"><span style="background:#2563eb"></span>의원/한의원 &nbsp;<span style="background:#dc2626"></span>병원급 &nbsp;<span style="background:#9ca3af"></span>방문완료</div>
    </div>
    <div id="panel">
      <div class="head">
        <div><b id="ptitle">구역 선택</b><div class="sub" id="psub"></div></div>
        <div style="display:flex;gap:6px">
          <button class="btn" id="sortBtn" title="정렬">거리순</button>
          <button class="btn" id="toggle-panel">접기</button>
        </div>
      </div>
      <div id="list"></div>
    </div>
  </div>

const map=L.map('map',{zoomControl:true}).setView([37.52,126.98],11);
// 지도 배경: https 호스팅이면 OSM 본서버, 로컬 파일(file://)이면 OSM 미러. 타일이 막히면 다음 소스로 자동 전환
const TILE_SOURCES = [
  ...(location.protocol==='file:' ? [] : [['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}]]),
  ['https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap (osm.de)'}],
  ['https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap (osm.fr)'}],
  ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'}],
];
let tileIdx=0, tiles=null, tileErr=0, tileOk=0;
function useTiles(i){
  if(tiles) map.removeLayer(tiles);
  tileIdx=i; tileErr=0; tileOk=0;
  tiles=L.tileLayer(TILE_SOURCES[i][0],TILE_SOURCES[i][1]).addTo(map);
  tiles.on('tileload',()=>{tileOk++;});
  tiles.on('tileerror',()=>{ tileErr++; if(tileErr>=4 && tileOk<2 && tileIdx<TILE_SOURCES.length-1) useTiles(tileIdx+1); });
}
useTiles(0);
const cluster=L.markerClusterGroup({disableClusteringAtZoom:15,maxClusterRadius:50,spiderfyOnMaxZoom:false,showCoverageOnHover:false});
map.addLayer(cluster);
const plain=L.layerGroup().addTo(map);

// ---- my location ----
let me=null, meMarker=null, meCircle=null, watchId=null;
function setMe(lat,lng,acc){
  me={lat,lng};
  if(!meMarker){ meMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:1000}).addTo(map).bindTooltip('내 위치');
    meCircle=L.circle([lat,lng],{radius:acc||30,color:'#2563eb',weight:1,fillOpacity:.08}).addTo(map); }
  else { meMarker.setLatLng([lat,lng]); meCircle.setLatLng([lat,lng]).setRadius(acc||30); }
  renderList();
}
function locate(fly){
  if(!navigator.geolocation){ alert('이 브라우저는 위치를 지원하지 않습니다'); return; }
  navigator.geolocation.getCurrentPosition(p=>{ setMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy); if(fly) map.flyTo([me.lat,me.lng],14); },
    e=>{ if(fly) alert('위치를 가져오지 못했습니다: '+e.message+'\n(브라우저 위치 권한을 허용해 주세요)'); },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  if(watchId==null && navigator.geolocation.watchPosition){
    watchId=navigator.geolocation.watchPosition(p=>setMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy),()=>{},{enableHighAccuracy:true,maximumAge:15000});
  }
}
document.getElementById('me-btn').onclick=()=>locate(true);
locate(false);

function distKm(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function fmtDist(k){ return k<1? Math.round(k*1000)+'m' : k.toFixed(1)+'km'; }

// ---- popup ----
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function popupHtml(h){
  const n=encodeURIComponent(h.name);
  const kakaoNavi=`kakaonavi://navigate?name=${n}&x=${h.lng}&y=${h.lat}&coord_type=wgs84`;
  const naver=`nmap://navigation?dlat=${h.lat}&dlng=${h.lng}&dname=${n}&appname=sanjae.map`;
  const tmap=`tmap://route?goalx=${h.lng}&goaly=${h.lat}&goalname=${n}`;
  const kmap=`https://map.kakao.com/link/to/${n},${h.lat},${h.lng}`;
  const d=me?` · 내 위치에서 ${fmtDist(distKm(me,h))}`:'';
  return `<div class="pp">
    <b>${esc(h.name)}</b>
    <div class="ad">${esc(h.addr)}</div>
    <div class="sub" style="color:#6b7280;font-size:12px">${esc(h.gu)} ${esc(h.dong)}${d}</div>
    <div class="nav">
      <a class="kakao" href="${kakaoNavi}">카카오내비</a>
      <a class="naver" href="${naver}">네이버</a>
      <a class="tmap" href="${tmap}">티맵</a>
      ${h.tel?`<a class="tel" href="tel:${h.tel}">☎ ${esc(h.tel)}</a>`:'<a class="tel" style="opacity:.4">전화없음</a>'}
      <a class="kmap" href="${kmap}" target="_blank">카카오맵(웹)</a>
      <a class="copy" href="#" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(h.addr)});this.textContent='복사됨';return false;">주소복사</a>
    </div>
    <label><input type="checkbox" ${state.visited[h.code]?'checked':''} onchange="toggleVisited('${h.code}',this.checked)"> 방문 완료</label>
    <textarea placeholder="메모 (담당자, 반응, 재방문일 등)" onchange="setMemo('${h.code}',this.value)">${esc(state.memo[h.code]||'')}</textarea>
  </div>`;
}
window.toggleVisited=function(code,on){ if(on) state.visited[code]=new Date().toISOString().slice(0,10); else delete state.visited[code]; save();
  const m=markers[code]; if(m) m.setIcon(icon(m.h)); renderList(); };
window.setMemo=function(code,v){ v=v.trim(); if(v) state.memo[code]=v; else delete state.memo[code]; save(); };

  const cur=selGu.value; selGu.innerHTML='<option value="">구역(시군구) 전체</option>';
  Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'ko')).forEach(g=>selGu.add(new Option(`${g} (${cnt[g]})`,g)));
  if(cnt[cur]) selGu.value=cur; fillDong();
}
function fillDong(){
  const g=selGu.value; const cnt={};
  if(g) H.filter(h=>h.gu===g).forEach(h=>cnt[h.dong]=(cnt[h.dong]||0)+1);
  const cur=selDong.value; selDong.innerHTML='<option value="">동 전체</option>';
  Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'ko')).forEach(d=>selDong.add(new Option(`${d} (${cnt[d]})`,d)));
  if(cnt[cur]) selDong.value=cur;
}
function filtered(){
  const s=selSido.value,g=selGu.value,d=selDong.value,k=q.value.trim();
  return H.filter(h=>(!s||h.sido===s)&&(!g||h.gu===g)&&(!d||h.dong===d)&&(!k||h.name.includes(k)||h.addr.includes(k))&&(!hideDone||!state.visited[h.code]));
}
function apply(fit){
  const list=filtered();
  cluster.clearLayers(); plain.clearLayers();
  if(selGu.value || list.length<=400){ list.forEach(h=>plain.addLayer(markers[h.code])); }   // 구역 선택 시 개별 핀
  else { cluster.addLayers(list.map(h=>markers[h.code])); }
  if(fit && list.length){ map.fitBounds(L.latLngBounds(list.map(h=>[h.lat,h.lng])).pad(0.1),{maxZoom:15,animate:false}); }
  renderList();
}
selSido.onchange=()=>{ selGu.value=''; selDong.value=''; fillGu(); apply(true); };
selGu.onchange=()=>{ selDong.value=''; fillDong(); apply(true); };
selDong.onchange=()=>apply(true);
q.oninput=()=>apply(false);
$('hideDone').onclick=function(){ hideDone=!hideDone; this.textContent='완료 숨김: '+(hideDone?'ON':'OFF'); apply(false); };
$('reset').onclick=()=>{ selSido.value='';selGu.value='';selDong.value='';q.value=''; fillGu(); apply(true); };
$('sortBtn').onclick=function(){ sortMode = sortMode==='dist'?'name':(sortMode==='name'?'route':'dist'); this.textContent={dist:'거리순',name:'이름순',route:'동선순'}[sortMode]; renderList(); };
$('toggle-panel').onclick=function(){ const p=$('panel'); p.classList.toggle('collapsed'); this.textContent=p.classList.contains('collapsed')?'펼치기':'접기'; setTimeout(()=>map.invalidateSize(),50); };

// greedy nearest-neighbour route from my location (or first item)
function routeOrder(list){
  if(!list.length) return list; const left=list.slice(); const out=[]; let cur=me||left[0];
  while(left.length){ let bi=0,bd=Infinity; left.forEach((h,i)=>{const d=distKm(cur,h); if(d<bd){bd=d;bi=i;}}); const n=left.splice(bi,1)[0]; out.push(n); cur=n; }
  return out;
}

// ---- panel ----
function renderList(){
  const s=selSido.value,g=selGu.value,d=selDong.value,k=q.value.trim();
  const list=filtered(); const L_=$('list');
  const done=list.filter(h=>state.visited[h.code]).length;
  if(!g && !k){
    // 구역 개요: 집중할 지역 찾기
    const cnt={}; list.forEach(h=>{ const key=h.sido+'|'+h.gu; cnt[key]=cnt[key]||{sido:h.sido,gu:h.gu,n:0,done:0,lat:0,lng:0}; cnt[key].n++; cnt[key].lat+=h.lat; cnt[key].lng+=h.lng; if(state.visited[h.code]) cnt[key].done++; });
    const arr=Object.values(cnt); arr.forEach(a=>{a.lat/=a.n;a.lng/=a.n; a.dist=me?distKm(me,a):null;});
    arr.sort((a,b)=> sortMode==='dist'&&me ? a.dist-b.dist : b.n-a.n);
    const max=Math.max(...arr.map(a=>a.n));
    $('ptitle').textContent=(s||'수도권')+' 구역 개요';
    $('psub').textContent=`${list.length.toLocaleString()}곳 · ${arr.length}개 구역 · 방문 ${done}곳 — 구역을 누르면 그 구역만 표시`;
    L_.innerHTML=arr.map(a=>`<div class="area" data-sido="${esc(a.sido)}" data-gu="${esc(a.gu)}">
      <div class="lbl"><div class="sido">${esc(a.sido)}${a.dist!=null?' · '+fmtDist(a.dist):''}</div><div><b>${esc(a.gu)}</b></div><div class="bar"><i style="width:${a.n/max*100}%"></i></div></div>
      <div class="cnt">${a.n}<small> 곳${a.done?' · 완료 '+a.done:''}</small></div></div>`).join('');
    L_.querySelectorAll('.area').forEach(el=>el.onclick=()=>{ selSido.value=el.dataset.sido; fillGu(); selGu.value=el.dataset.gu; fillDong(); apply(true); });
    return;
  }
  let arr=list.slice();
  if(sortMode==='dist'&&me) arr.sort((a,b)=>distKm(me,a)-distKm(me,b));
  else if(sortMode==='route') arr=routeOrder(arr);
  else arr.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  $('ptitle').textContent=(g?g+(d?' '+d:''):'검색: '+k)+' 구역 카드';
  $('psub').textContent=`${list.length}곳 · 방문완료 ${done}곳 · 남은 ${list.length-done}곳`+(sortMode==='route'?' · 내 위치에서 가까운 순서로 동선 제안':'');
  L_.innerHTML=arr.map((h,i)=>`<div class="row ${state.visited[h.code]?'done':''}" data-code="${h.code}">
    <div class="idx">${i+1}</div>
    <div class="body"><div class="nm">${esc(h.name)}${h.big?' <span style="color:#dc2626;font-size:11px">●</span>':''}</div><div class="ad">${esc(h.addr)}</div>
    <div class="ad">${esc(h.dong)}${h.tel?' · '+esc(h.tel):''}${state.memo[h.code]?' · 📝 '+esc(state.memo[h.code]):''}</div></div>
    <div style="text-align:right"><div class="dist">${me?fmtDist(distKm(me,h)):''}</div><input type="checkbox" ${state.visited[h.code]?'checked':''} title="방문 완료"></div>
  </div>`).join('');
  L_.querySelectorAll('.row').forEach(el=>{
    const code=el.dataset.code;
    el.querySelector('input').onclick=e=>{ e.stopPropagation(); toggleVisited(code,e.target.checked); };
    el.onclick=()=>{ const m=markers[code]; map.flyTo(m.getLatLng(),17,{duration:.6}); setTimeout(()=>{ if(cluster.hasLayer(m)) cluster.zoomToShowLayer(m,()=>m.openPopup()); else m.openPopup(); },650);
      if(window.innerWidth<=760){ $('panel').classList.add('collapsed'); $('toggle-panel').textContent='펼치기'; setTimeout(()=>map.invalidateSize(),50);} };
  });
}

fillGu(); apply(false);
</script>
</body>
</html>
